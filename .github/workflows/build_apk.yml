name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet & Build APK
        run: |
          pip install flet requests PySocks urllib3
          flet build apk --project "OmniProxyChecker" --yes

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: OmniProxyChecker-APK
          path: build/apk/*.apk
